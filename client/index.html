<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#090d16" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FluentAI • Real-Time English Voice Practice</title>
    <meta name="description" content="Practice spoken English naturally with real-time interactive voice conversations." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        console.error('CRITICAL WINDOW ERROR:', e);
        var div = document.createElement('div');
        div.style = 'position:fixed;inset:0;background:#0f172a;color:#ef4444;padding:24px;font-family:monospace;white-space:pre-wrap;z-index:999999;overflow:auto;';
        div.innerHTML = '<h2>Application Runtime Error</h2><p>' + (e.error ? (e.error.stack || e.error.message) : e.message) + '</p>';
        document.body.appendChild(div);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('CRITICAL UNHANDLED REJECTION:', e);
        var div = document.createElement('div');
        div.style = 'position:fixed;inset:0;background:#0f172a;color:#ef4444;padding:24px;font-family:monospace;white-space:pre-wrap;z-index:999999;overflow:auto;';
        div.innerHTML = '<h2>Unhandled Promise Rejection</h2><p>' + (e.reason ? (e.reason.stack || e.reason.message || e.reason) : 'Promise rejected') + '</p>';
        document.body.appendChild(div);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
