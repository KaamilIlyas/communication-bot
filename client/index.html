<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z'/><path d='M19 10v2a7 7 0 0 1-14 0v-2'/><line x1='12' x2='12' y1='19' y2='22'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FluentAI • Real-Time English Voice Practice</title>
    <meta name="description" content="Practice spoken English naturally with real-time interactive voice conversations." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        console.error('CRITICAL WINDOW ERROR:', e);
        var div = document.createElement('div');
        div.style = 'position:fixed;inset:0;background:#0f172a;color:#ef4444;padding:24px;font-family:monospace;white-space:pre-wrap;z-index:999999;overflow:auto;';
        div.innerHTML = '<h2>Application Runtime Error</h2><p>' + (e.error ? (e.error.stack || e.error.message) : e.message) + '</p>';
        document.body.appendChild(div);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('CRITICAL UNHANDLED REJECTION:', e);
        var div = document.createElement('div');
        div.style = 'position:fixed;inset:0;background:#0f172a;color:#ef4444;padding:24px;font-family:monospace;white-space:pre-wrap;z-index:999999;overflow:auto;';
        div.innerHTML = '<h2>Unhandled Promise Rejection</h2><p>' + (e.reason ? (e.reason.stack || e.reason.message || e.reason) : 'Promise rejected') + '</p>';
        document.body.appendChild(div);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
